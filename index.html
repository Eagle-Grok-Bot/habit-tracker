<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b6cff" />
  <title>习惯打卡 · Eagle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div>
          <h1 class="title">习惯打卡</h1>
          <p class="subtitle" id="todayLabel">今天</p>
        </div>
        <button type="button" class="btn btn-primary btn-icon" id="btnAdd" title="新建习惯" aria-label="新建习惯">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="today" role="tab">今日</button>
        <button type="button" class="tab" data-tab="calendar" role="tab">日历</button>
        <button type="button" class="tab" data-tab="stats" role="tab">统计</button>
        <button type="button" class="tab" data-tab="habits" role="tab">管理</button>
      </nav>
    </header>

    <main class="main">
      <!-- 今日打卡 -->
      <section id="panel-today" class="panel active" role="tabpanel">
        <div id="todaySummary" class="summary-card"></div>
        <div id="todayList" class="habit-list"></div>
        <div id="todayEmpty" class="empty hidden">
          <div class="empty-icon">✨</div>
          <p>还没有习惯</p>
          <button type="button" class="btn btn-primary" id="btnAddFromToday">新建第一个习惯</button>
        </div>
      </section>

      <!-- 日历历史 -->
      <section id="panel-calendar" class="panel" role="tabpanel">
        <div class="habit-picker-wrap">
          <label for="calHabitSelect" class="field-label">选择习惯</label>
          <select id="calHabitSelect" class="select"></select>
        </div>
        <div class="cal-nav">
          <button type="button" class="btn btn-ghost btn-icon" id="calPrev" aria-label="上一月">‹</button>
          <h2 class="cal-month" id="calMonthLabel"></h2>
          <button type="button" class="btn btn-ghost btn-icon" id="calNext" aria-label="下一月">›</button>
        </div>
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="calGrid" class="cal-grid"></div>
        <p class="cal-hint" id="calHint"></p>
      </section>

      <!-- 统计 -->
      <section id="panel-stats" class="panel" role="tabpanel">
        <div class="habit-picker-wrap">
          <label for="statsHabitSelect" class="field-label">选择习惯</label>
          <select id="statsHabitSelect" class="select"></select>
        </div>
        <div class="cycle-tabs" role="tablist">
          <button type="button" class="cycle active" data-cycle="7">近7天</button>
          <button type="button" class="cycle" data-cycle="month">本月</button>
          <button type="button" class="cycle" data-cycle="year">本年</button>
        </div>
        <div id="statsCards" class="stats-cards"></div>
        <div class="dates-block">
          <h3 class="dates-title">打卡日期</h3>
          <ul id="statsDates" class="dates-list"></ul>
        </div>
      </section>

      <!-- 习惯管理 -->
      <section id="panel-habits" class="panel" role="tabpanel">
        <div id="manageList" class="manage-list"></div>
        <div id="manageEmpty" class="empty hidden">
          <div class="empty-icon">📝</div>
          <p>暂无习惯，点上方 + 添加</p>
        </div>
      </section>
    </main>
  </div>

  <!-- 新建/编辑弹窗 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-sheet">
      <h2 id="modalTitle" class="modal-title">新建习惯</h2>
      <form id="habitForm">
        <input type="hidden" id="editId" />
        <label class="field">
          <span class="field-label">名称</span>
          <input type="text" id="habitName" class="input" maxlength="40" placeholder="例如：早起、运动、阅读" required />
        </label>
        <label class="field">
          <span class="field-label">图标</span>
          <div class="icon-grid" id="iconGrid"></div>
        </label>
        <label class="field">
          <span class="field-label">颜色</span>
          <div class="color-grid" id="colorGrid"></div>
        </label>
        <label class="field">
          <span class="field-label">备注（可选）</span>
          <input type="text" id="habitNote" class="input" maxlength="80" placeholder="提醒自己为什么要做" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 确认删除 -->
  <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="confirmBackdrop"></div>
    <div class="modal-sheet modal-sheet-sm">
      <h2 class="modal-title">删除习惯？</h2>
      <p class="confirm-text" id="confirmText">删除后打卡记录也会一并清除，无法恢复。</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnConfirmCancel">取消</button>
        <button type="button" class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
